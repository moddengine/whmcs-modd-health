name: QA and release

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: modd_health_test
          MARIADB_USER: modd_health
          MARIADB_PASSWORD: modd_health
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, pdo_mysql, posix, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer qa
      - run: go test -mod=mod ./...
        env:
          MODD_HEALTH_TEST_DSN: modd_health:modd_health@tcp(127.0.0.1:3306)/modd_health_test?parseTime=true
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint
      - run: shellcheck bin/build-release

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, pdo_mysql, posix, zip
          coverage: none
          tools: composer:v2
      - name: Build release
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          composer install --no-interaction --no-progress --prefer-dist
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          bin/build-release "${GITHUB_REF_NAME#v}"
          echo "ASSET=whmcs-modd-health-${GITHUB_REF_NAME#v}.zip" >> "$GITHUB_ENV"
      - name: Smoke-test binaries
        run: |
          test "$(build/modules/addons/modd_health/bin/modd-health-checker-linux-amd64 --version)" = "${GITHUB_REF_NAME#v}"
          docker run --rm --platform linux/arm64 -v "$PWD/build/modules/addons/modd_health/bin:/bin-test:ro" alpine:3.22 /bin-test/modd-health-checker-linux-arm64 --version | grep -Fx "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
